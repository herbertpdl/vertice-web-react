name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Re-runs CI and redeploys the head of main (e.g. after DEPLOY_ENABLED is switched on).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: one group per PR, so a new push cancels the superseded run. Pushes to main: one group
  # per commit (GitHub would otherwise replace a still-pending run in the same group), so every
  # merged commit gets its own full result.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Fails when src/lib/api/schema.ts no longer matches vertice-bff's docs/openapi.json at the
      # commit pinned in src/lib/api/.bff-ref (XREPO-005, XREPO-013). Fetches the spec from the
      # public vertice-bff repo, so it needs no token.
      - name: Check the generated API types are current
        run: npm run api:types -- --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # The same unit suite again in two processes pinned ahead of and behind UTC, proving nothing
      # depends on the host's time zone (P2-02; mirrors vertice-bff's own test:hostile-tz step and
      # vertice-api's hostileTimeZoneTest). Load-bearing, not ceremony: the Intl.DateTimeFormats in
      # src/lib/format.ts resolve their zone when they are constructed at module load, so an
      # in-process TZ flip cannot catch a missing `timeZone` option — only a separate process can.
      - name: Run the unit suite under hostile time zones
        run: npm run test:hostile-tz
      # No BFF needed: nothing calls it at build time, and src/instrumentation.ts skips the
      # TRUSTED_PROXY_HOPS boot check during `next build` (the deploy environment sets it).
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  storybook:
    # Every *.stories.tsx rendered and played in headless Chromium (vitest `storybook` project).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser only; its system libraries still come from apt.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:storybook

  # ---- Continuous deployment (see the README's "Continuous deployment") ----
  # Only main, only after every CI job above passed on this same commit, and only while the
  # repository variable DEPLOY_ENABLED is 'true' (unset it to freeze deploys).
  deploy:
    needs: [build-and-test, storybook]
    if: >-
      vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Native arm64 runner (free on public repos): the Fargate tasks are Graviton/ARM64, and
    # building under QEMU emulation would be several times slower.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> the vertice-web-deploy IAM role; no stored AWS keys
    # One deploy of this service at a time, in order. `queue: max` keeps every pending deploy
    # (the default keeps one and cancels the rest, which could cancel the newest commit's deploy
    # while an older one later skips itself as superseded); superseded ones skip at the first step.
    concurrency:
      group: deploy-vertice-web
      cancel-in-progress: false
      queue: max
    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: vertice-web
      ECS_CLUSTER: vertice
      ECS_SERVICE: vertice-web
      CONTAINER_NAME: vertice-web
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only the newest commit on main deploys: CI runs once per commit, so an older commit whose
      # CI finishes last, or a re-run of an old run, must not overwrite a newer deploy. Checked
      # here (inside the concurrency slot, on every attempt) and again just before the rollout.
      - name: Is this commit still the head of main?
        id: head
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now at ${head}; not deploying ${GITHUB_SHA} (the newer commit deploys itself)."
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.head.outputs.current == 'true'
        with:
          persist-credentials: false

      - name: Image tag (12-character commit SHA)
        if: steps.head.outputs.current == 'true'
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: steps.head.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::096571798756:role/vertice-web-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.head.outputs.current == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable in ECR, so a re-run (or a manual redeploy of the same head commit)
      # reuses the image already pushed instead of failing on the push.
      - name: Check whether this commit's image is already in ECR
        if: steps.head.outputs.current == 'true'
        id: existing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if out="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException <<<"$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true' && steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Dockerfile.prod (linux/arm64)
        if: steps.head.outputs.current == 'true' && steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          # Plain image manifest (no attestation index), so ECR scan-on-push reports on it.
          provenance: false
          cache-from: type=gha,scope=deploy-arm64
          cache-to: type=gha,scope=deploy-arm64,mode=max

      - name: Render the task definition with the new image
        if: steps.head.outputs.current == 'true'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: .aws/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      # A newer commit may have merged during the build; then it deploys itself after this job.
      - name: Is this commit still the head of main (before the rollout)?
        if: steps.head.outputs.current == 'true'
        id: recheck
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now at ${head}; not deploying ${GITHUB_SHA} (the newer commit deploys itself)."
          fi

      # Registers a new revision of the task family, points the service at it and waits until
      # the rollout completes. If the new tasks never get healthy, the service's deployment
      # circuit breaker rolls back to the previous revision and this step fails.
      - name: Deploy to ECS and wait for the rollout
        if: steps.recheck.outputs.current == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 10
          wait-max-delay-seconds: 15
          # The action drops empty values by default; keep them, so a deliberately empty env value survives
          # (none today; the same setting as vertice-api and vertice-bff).
          keep-null-value-keys: value
